# SPDX-License-Identifier: GPL-2.0-or-later
# Paquet QPKG qBittorrent (qBittorrent-nox statique, x86_64 et ARM 64 bits). Voir README.md.
QPKG_NAME="qBittorrent"
QPKG_DISPLAY_NAME="qBittorrent"
QPKG_VER="5.3.3.1"
QPKG_AUTHOR="qbittorrent-qnap (projet communautaire)"
QPKG_LICENSE="GPLv2+"
QPKG_SUMMARY="Client BitTorrent avec interface web (port 8085, ou /qbittorrent/ via QTS et myQNAPcloud Link). Première connexion : admin / adminadmin, mot de passe à changer ensuite."

QPKG_RC_NUM="101"
QPKG_SERVICE_PROGRAM="qBittorrent.sh"
QPKG_SERVICE_PIDFILE="/var/run/qBittorrent.pid"

# Interface web (8080 est déjà pris par QTS)
QPKG_WEBUI="/"
QPKG_WEB_PORT="8085"
QPKG_SERVICE_PORT="8085"
# Accès aussi par le serveur web de QTS (proxy QTS) : http(s)://NAS:8080/qbittorrent/
# C'est ce qui rend l'interface accessible par myQNAPcloud Link.
# Barre oblique finale indispensable : QTS génère « ProxyPass "<chemin>" "http://127.0.0.1:<port>/" »,
# sans elle qBittorrent recevrait « // » au lieu de « / ».
QPKG_USE_PROXY="1"
QPKG_PROXY_PATH="/qbittorrent/"

QTS_MINI_VERSION="4.5.0"
QPKG_TIMEOUT="30,60"
