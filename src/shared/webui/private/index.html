<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qBittorrent</title>
<style>
  :root {
    --blue:#1866c2; --blue-dark:#0e4c97; --blue-soft:#e3eefb; --blue-line:#b9d3f3;
    --bg:#f4f6f9; --panel:#ffffff; --side:#eef2f7; --text:#1f2a37; --muted:#6b7a8c;
    --border:#d8e0ea; --row:#f7f9fc; --hover:#edf4fd;
    --green:#2e9d5b; --orange:#d9861c; --red:#c9443a; --grey:#8a96a5;
    --folder:#f2b544; --folder-dark:#d99a24;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font:13.5px/1.4 "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color:var(--text); background:var(--bg); overflow:hidden; }
  button, input, textarea { font:inherit; color:inherit; }
  svg { display:block; }

  /* --- Barre du haut --- */
  .top { height:48px; display:flex; align-items:center; gap:12px; padding:0 14px; color:#fff;

  .brand { display:flex; align-items:center; gap:9px; font-weight:600; font-size:15.5px; white-space:nowrap; }
  .grow { flex:1; }
  .speeds { display:flex; gap:14px; font-size:12.5px; opacity:.95; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .tbtn { background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); color:#fff; border-radius:5px; padding:5px 10px; cursor:pointer; white-space:nowrap; }
  .tbtn:hover { background:rgba(255,255,255,.22); }
  .burger { display:none; background:none; border:0; color:#fff; padding:6px; cursor:pointer; }

  /* --- Disposition --- */
  .layout { display:flex; height:calc(100% - 48px); }
  .side { width:250px; flex:none; background:var(--side); border-right:1px solid var(--border); overflow:auto; padding:10px 0 20px; }
  .sec { font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding:12px 16px 6px; }
  .nav { display:flex; align-items:center; gap:8px; padding:6px 16px; cursor:pointer; user-select:none; }
  .nav:hover, .tn:hover { background:#e2e9f2; }
  .nav.on, .tn.on { background:var(--blue-soft); color:var(--blue-dark); font-weight:600; box-shadow:inset 3px 0 0 var(--blue); }
  .nav .cnt { margin-left:auto; font-size:11.5px; color:var(--muted); background:#fff; border:1px solid var(--border); border-radius:10px; padding:0 7px; font-variant-numeric:tabular-nums; }
  .tn { display:flex; align-items:center; gap:5px; padding:4px 10px; cursor:pointer; user-select:none; white-space:nowrap; }
  .tn .nm { overflow:hidden; text-overflow:ellipsis; }

  .caret:hover { background:#d3dce8; }

  .caret.none { visibility:hidden; }

  main { flex:1; min-width:0; display:flex; flex-direction:column; background:var(--panel); }
  .toolbar { display:flex; align-items:center; flex-wrap:wrap; gap:6px; padding:8px 12px; border-bottom:1px solid var(--border); background:#fbfcfe; }
  .btn { display:inline-flex; align-items:center; gap:6px; padding:6px 11px; border:1px solid var(--border); background:#fff; border-radius:5px; cursor:pointer; white-space:nowrap; }
  .btn:hover:not(:disabled) { background:var(--hover); border-color:var(--blue-line); }
  .btn:disabled { opacity:.45; cursor:default; }
  .btn.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
  .btn.primary:hover:not(:disabled) { background:var(--blue-dark); }
  .btn.danger { color:var(--red); }
  .search { width:190px; padding:6px 10px; border:1px solid var(--border); border-radius:5px; background:#fff; }
  .search:focus, textarea:focus, .field:focus { outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(24,102,194,.15); }
  .seg { display:inline-flex; border:1px solid var(--border); border-radius:5px; overflow:hidden; }
  .seg button { border:0; background:#fff; padding:6px 8px; cursor:pointer; color:var(--muted); }
  .seg button.on { background:var(--blue-soft); color:var(--blue-dark); }

  .pathbar { display:flex; align-items:center; gap:6px; padding:6px 12px; border-bottom:1px solid var(--border); min-height:40px; }
  .ibtn { width:28px; height:28px; display:inline-flex; align-items:center; justify-content:center; border:1px solid transparent; background:none; border-radius:4px; cursor:pointer; color:#4a5a6c; flex:none; }
  .ibtn:hover:not(:disabled) { background:var(--hover); border-color:var(--blue-line); }
  .ibtn:disabled { opacity:.35; cursor:default; }
  .crumbs { display:flex; align-items:center; flex-wrap:wrap; gap:2px; flex:1; min-width:0; padding:3px 8px; border:1px solid var(--border); border-radius:5px; background:#fff; }
  .crumbs a { color:var(--text); text-decoration:none; padding:1px 5px; border-radius:3px; cursor:pointer; }
  .crumbs a:hover { background:var(--hover); color:var(--blue-dark); }
  .crumbs .sep { color:var(--grey); }
  .crumbs b { padding:1px 5px; }

  .content { flex:1; overflow:auto; position:relative; }
  .content.drag::after { content:attr(data-drop); position:absolute; inset:10px; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px;
                         border:2px dashed var(--blue); border-radius:10px; background:rgba(227,238,251,.92); color:var(--blue-dark); font-weight:600; font-size:15px; pointer-events:none; }
  /* --- Panneau de détails d'un torrent --- */
  .details { flex:none; height:42%; min-height:200px; max-height:420px; display:flex; flex-direction:column; border-top:2px solid var(--border); background:#fff; }
  .details[hidden] { display:none; }
  .dtabs { display:flex; align-items:center; gap:2px; padding:0 8px 0 12px; border-bottom:1px solid var(--border); background:#f1f4f8; min-height:38px; }
  .dtabs button.tab { border:0; background:none; padding:9px 12px; cursor:pointer; color:var(--muted); font-weight:600; border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; }
  .dtabs button.tab.on { color:var(--blue-dark); border-bottom-color:var(--blue); }
  .dtabs .dname { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:right; color:var(--muted); font-size:12px; padding:0 8px; }
  .dbody { flex:1; overflow:auto; }
  .kv { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:4px 28px; padding:14px 18px; }

  .kv div.wide { grid-column:1 / -1; }
  .kv dt { color:var(--muted); text-align:right; }
  .kv dd { margin:0; min-width:0; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
  .kv dd .folderlink { white-space:normal; }

  tr.focus td { box-shadow:inset 0 1px 0 var(--blue), inset 0 -1px 0 var(--blue); }
  tr.skip td { color:var(--grey); }
  .statusbar { display:flex; gap:16px; align-items:center; padding:5px 12px; border-top:1px solid var(--border); background:#fbfcfe; color:var(--muted); font-size:12px; min-height:28px; }
  .statusbar a { color:var(--blue); cursor:pointer; }
  .hint { margin:10px 12px 0; padding:9px 12px; border:1px solid var(--blue-line); background:var(--blue-soft); border-radius:6px; color:var(--blue-dark); font-size:12.5px; }

  /* --- Tableaux --- */
  table { width:100%; border-collapse:collapse; }

  td { padding:6px 10px; border-bottom:1px solid #edf1f5; vertical-align:middle; }

  .name span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .num { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .muted { color:var(--muted); }
  tr.dir, tr.tor { cursor:pointer; }
  tr.other td { color:var(--muted); }
  .tag { font-size:11px; font-style:normal; color:var(--orange); border:1px solid #f0cf9f; background:#fff6e8; border-radius:3px; padding:0 5px; margin-left:4px; }
  .prog { position:relative; height:16px; min-width:110px; border-radius:3px; background:#e6ebf1; overflow:hidden; }
  .prog i { position:absolute; inset:0 auto 0 0; background:var(--blue); }
  .prog.done i { background:var(--green); }
  .prog.stop i { background:var(--grey); }
  .prog.err i { background:var(--red); }

  .st { display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .st::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--grey); }
  .st.dl::before { background:var(--blue); } .st.up::before, .st.done::before { background:var(--green); }
  .st.wait::before { background:var(--orange); } .st.err::before { background:var(--red); }
  .folderlink { color:var(--blue); cursor:pointer; white-space:nowrap; }
  .folderlink:hover { text-decoration:underline; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:6px; padding:12px; }
  .tile { display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 6px 10px; border:1px solid transparent; border-radius:6px; text-align:center; position:relative; }
  .tile.dir, .tile.tor { cursor:pointer; }
  .tile:hover { background:var(--hover); border-color:var(--blue-line); }
  .tile.sel { background:#d7e7fb; border-color:var(--blue-line); }
  .tile.other { opacity:.55; }
  .tile .lbl { font-size:12.5px; line-height:1.3; word-break:break-word; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .tile input { position:absolute; top:6px; left:6px; margin:0; }

  .empty { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:60px 20px; color:var(--muted); text-align:center; }
  .empty strong { color:var(--text); font-size:15px; }

  /* --- Fenêtres --- */
  .backdrop { position:fixed; inset:0; background:rgba(15,30,50,.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:20; }
  .dlg { width:100%; max-width:520px; max-height:calc(100vh - 32px); display:flex; flex-direction:column; background:#fff; border-radius:8px; box-shadow:0 20px 60px rgba(0,0,0,.3); overflow:hidden; }
  .dlg h2 { margin:0; padding:13px 18px; font-size:15px; background:#f1f4f8; border-bottom:1px solid var(--border); }
  .dlg .body { padding:16px 18px; overflow:auto; display:grid; gap:12px; }
  .dlg .foot { display:flex; justify-content:flex-end; gap:8px; padding:12px 18px; border-top:1px solid var(--border); background:#fbfcfe; }
  .dlg label { display:grid; gap:5px; font-size:12.5px; color:var(--muted); }
  .dlg .chk { display:flex; align-items:center; gap:8px; color:var(--text); font-size:13.5px; cursor:pointer; }
  .field, textarea { width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:5px; }
  textarea { resize:vertical; font-family:ui-monospace, Consolas, monospace; font-size:12.5px; }
  .addlist { list-style:none; margin:0; padding:0; border:1px solid var(--border); border-radius:6px; max-height:200px; overflow:auto; }
  .addlist li { display:flex; align-items:center; gap:8px; padding:6px 10px; border-bottom:1px solid #edf1f5; }
  .addlist li:last-child { border-bottom:0; }
  .addlist small { color:var(--muted); margin-left:auto; white-space:nowrap; }
  .dest { display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--blue-soft); border:1px solid var(--blue-line); border-radius:6px; }
  .dest small { display:block; color:var(--muted); font-size:11.5px; }
  .dest b { word-break:break-all; font-weight:600; }
  .err { color:var(--red); font-size:12.5px; min-height:1em; margin:0; }

  .toast { position:fixed; right:16px; bottom:16px; max-width:360px; padding:11px 15px; border-radius:6px; background:#1f2a37; color:#fff; box-shadow:0 8px 30px rgba(0,0,0,.25);
           transform:translateY(20px); opacity:0; transition:.2s; pointer-events:none; z-index:30; }
  .toast.show { transform:none; opacity:1; }
  .toast.bad { background:var(--red); }

  @media (max-width: 900px) {
    .hide-md { display:none; }
  }
  /* --- Barre de menus et menus déroulants --- */
  .menubar { display:flex; gap:1px; margin-left:6px; }
  .menubar > button { background:none; border:0; color:#fff; padding:6px 10px; border-radius:4px; cursor:pointer; font-size:13.5px; white-space:nowrap; }
  .menubar > button:hover, .menubar > button.open { background:rgba(255,255,255,.18); }
  .menubar > .mall { display:none; }
  .menu { position:fixed; z-index:40; min-width:250px; max-height:calc(100vh - 16px); overflow:auto; padding:4px 0; background:#fff; color:var(--text);
          border:1px solid var(--border); border-radius:6px; box-shadow:0 12px 32px rgba(15,30,50,.22); }
  .menu button { display:flex; align-items:center; gap:10px; width:100%; padding:7px 16px 7px 10px; border:0; background:none; text-align:left; cursor:pointer; font-size:13.5px; white-space:nowrap; }
  .menu button:hover:not(:disabled), .menu button:focus-visible { background:var(--hover); outline:none; }
  .menu button:disabled { color:#a8b2bf; cursor:default; }
  .menu .mi { width:18px; display:flex; justify-content:center; color:var(--muted); flex:none; }
  .menu hr { border:0; border-top:1px solid var(--border); margin:4px 0; }
  .menu .mh { padding:8px 14px 3px; font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); }
  .menu button .sub { margin-left:auto; padding-left:18px; color:var(--muted); }
  .menu button.open { background:var(--hover); }
  th[data-sort] { cursor:pointer; user-select:none; }
  th[data-sort]:hover { color:var(--blue-dark); }
  th .arr { font-size:10px; margin-left:3px; color:var(--blue); }
  .dtool { display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--border); background:#fafbfd; }
  .dtool .btn { padding:4px 10px; font-size:12.5px; }
  .dbody tr.dsel td { background:var(--sel); }
  .st.offline { background:#fde8e8; color:var(--red); }
  .preview { max-height:220px; overflow:auto; border:1px solid var(--border); border-radius:4px; font-size:12.5px; }
  .preview td { padding:3px 8px; } .preview .old { color:var(--muted); text-decoration:line-through; }
  .radio { display:flex; align-items:center; gap:8px; } .radio input { margin:0; }
  .sub-fields { display:grid; gap:6px; padding-left:24px; }

  /* --- Fenêtres larges : réglages, journal --- */

  .settings { display:grid; grid-template-columns:190px minmax(0,1fr); margin:-16px -18px 0; min-height:440px; }
  .settings nav { border-right:1px solid var(--border); background:#f7f9fc; padding:8px 0; }
  .settings nav button { display:block; width:100%; text-align:left; border:0; background:none; padding:9px 16px; cursor:pointer; color:var(--text); }
  .settings nav button:hover { background:#e9eff7; }
  .settings nav button.on { background:var(--blue-soft); color:var(--blue-dark); font-weight:600; box-shadow:inset 3px 0 0 var(--blue); }
  .settings section { padding:16px 20px; display:grid; gap:12px; align-content:start; }
  .settings section[hidden] { display:none; }
  .settings h3 { margin:0; font-size:15px; }
  .settings h4 { margin:8px 0 0; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .settings p { margin:0; color:var(--muted); font-size:12.5px; }
  .srow { display:grid; grid-template-columns:minmax(0,1fr) 190px; gap:12px; align-items:center; }
  .srow.full { grid-template-columns:1fr; gap:5px; }

  .srow > label small { display:block; color:var(--muted); font-size:11.5px; }
  .srow .unit { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:12.5px; }
  .srow .unit .field { min-width:0; }
  .settings .chk { display:flex; align-items:center; gap:8px; cursor:pointer; color:var(--text); font-size:13.5px; }
  .settings .off { opacity:.45; }
  .sched { display:flex; flex-wrap:wrap; gap:6px; align-items:center; color:var(--muted); font-size:12.5px; }
  .sched .field { width:auto; }
  .logt td { vertical-align:top; font-size:12.5px; }
  .logt tr.warn td { color:var(--orange); } .logt tr.crit td { color:var(--red); font-weight:600; }
  @media (max-width: 760px) {
    .menubar > button { display:none; }
    .menubar > .mall { display:block; }
    .settings { grid-template-columns:1fr; min-height:0; }
    .settings nav { display:flex; overflow-x:auto; border-right:0; border-bottom:1px solid var(--border); padding:0; }
    .settings nav button { width:auto; white-space:nowrap; }
    .srow { grid-template-columns:1fr; gap:5px; }
  }
  @media (max-width: 760px) {
    .burger { display:block; }
    .speeds, .hide-sm { display:none; }
    .side { position:fixed; top:48px; bottom:0; left:0; z-index:10; transform:translateX(-100%); transition:transform .18s; box-shadow:4px 0 20px rgba(0,0,0,.15); }
    body.side-open .side { transform:none; }
    .search { width:100%; order:10; }
    .btn .lbl-long { display:none; }
    .top { gap:6px; padding:0 8px; }
    .tbtn { padding:5px 7px; font-size:12.5px; }

  @media (max-width: 440px) {

  }
</style>

<div class="layout">

    <div class="statusbar" id="statusbar"></div>
  </main>
</div>

<input type="file" id="pick" accept=".torrent,application/x-bittorrent" multiple hidden>
<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
// Racine de navigation : /share sur un QNAP (modifiable avec ?root=/chemin pour les tests)
const ROOT = (new URLSearchParams(location.search).get('root') || '/share').replace(/\/+$/, '') || '/';
const coll = new Intl.Collator('fr', { numeric: true, sensitivity: 'base' });

const base = (p) => p.replace(/\/+$/, '').split('/').pop() || p;
const join = (p, n) => (p === '/' ? '' : p.replace(/\/+$/, '')) + '/' + n;
const parent = (p) => { const i = p.replace(/\/+$/, '').lastIndexOf('/'); return i <= 0 ? '/' : p.slice(0, i); };

// Sur QTS, /share/CACHEDEV1_DATA/Download est aussi accessible en /share/Download
function normalize(p) {
  if (!p) return p;
  p = p.replace(/\/+$/, '') || '/';
  if (ROOT === '/share') p = p.replace(/^\/share\/(CACHEDEV\d+_DATA|MD\d+_DATA|HD[A-Z]_DATA|ZFS\d+_DATA)(?=\/|$)/, '/share');
  return p;
}
function visibleName(name, dir) {
  if (/^[.@#]/.test(name) || name === 'lost+found') return false;
  if (dir === ROOT && /^(CACHEDEV\d+_DATA|MD\d+_DATA|HD[A-Z]_DATA|ZFS\d+_DATA|NFSv=4)$/.test(name)) return false;
  return true;
}
function fmtSize(n) {
  if (!n || n < 0) return '0 o';
  if (n < 1024) return n + ' o';
  const u = ['Ko', 'Mo', 'Go', 'To']; let i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
  return n.toLocaleString('fr-FR', { maximumFractionDigits: n < 10 ? 1 : 0 }) + ' ' + u[i];
}
const fmtSpeed = (n) => (n > 0 ? fmtSize(n) + '/s' : '—');
function fmtEta(s) {
  if (!(s > 0) || s >= 8640000) return '∞';
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  if (d) return `${d} j ${h} h`;
  if (h) return `${h} h ${m} min`;
  if (m) return `${m} min`;
  return `${s} s`;
}

}

/* ---------- API qBittorrent ---------- */
async function api(path, opts) {
  const r = await fetch('api/v2/' + path, opts);
  if (r.status === 401 || (r.status === 403 && !/setPreferences/.test(path))) { location.reload(); throw new Error('session'); }
  return r;
}
async function listDir(p, mode) {
  const r = await api(`app/getDirectoryContent?dirPath=${encodeURIComponent(p)}&mode=${mode}`);
  if (!r.ok) return null;
  return r.json();
}
async function post(path, params) {
  return api(path, { method: 'POST', body: params instanceof FormData ? params : new URLSearchParams(params) });
}
async function torrentAction(action, hashes) {
  const legacy = { start: 'resume', stop: 'pause' }[action];
  let r = await post('torrents/' + action, { hashes: hashes.join('|') });
  if (r.status === 404 && legacy) r = await post('torrents/' + legacy, { hashes: hashes.join('|') });
  return r.ok;
}

function kidsOf(p) {
  const k = [...(tree.kids.get(p) || [])];
  for (const v of virtualDirs.get(p) || []) if (!k.includes(v)) k.push(v);
  return k.sort(coll.compare);
}
async function loadKids(p, force = false) {
  if (force || !tree.kids.has(p)) {
    const d = await listDir(p, 'dirs');
    tree.kids.set(p, (d || []).map(base).filter((n) => visibleName(n, p)));
  }
  return kidsOf(p);
}
function isVirtual(p) { const s = virtualDirs.get(parent(p)); return !!(s && s.has(base(p))) && !(tree.kids.get(parent(p)) || []).includes(base(p)); }
function renderTree() {
  const top = tree.kids.has(ROOT) ? kidsOf(ROOT) : null;
  if (top === null) return;
  if (!top.length) { $('#tree').innerHTML = `<div class="tree-msg">Aucun dossier partagé trouvé dans ${esc(ROOT)}.</div>`; return; }
  const node = (p, depth) => {
    const open = tree.open.has(p), known = tree.kids.has(p), kids = known ? kidsOf(p) : [];
    const caretCls = known && !kids.length && !virtualDirs.has(p) ? 'none' : (open ? 'open' : '');
    const on = state.view === 'folder' && state.path === p;
    let h = `<div class="tn${on ? ' on' : ''}" role="treeitem" aria-expanded="${open}" data-path="${esc(p)}" style="padding-left:${10 + depth * 16}px">
      <span class="caret ${caretCls}" data-toggle>${I.caret()}</span>${I.folder(18, isVirtual(p))}<span class="nm">${esc(base(p))}</span></div>`;
    if (open) h += kids.map((k) => node(join(p, k), depth + 1)).join('');
    return h;
  };
  $('#tree').innerHTML = top.map((k) => node(join(ROOT, k), 0)).join('');
}

/* ---------- Navigation ---------- */
function ancestors(p) {
  if (p === ROOT || !p.startsWith(ROOT === '/' ? '/' : ROOT + '/')) return [];
  const out = []; let cur = parent(p);
  for (;;) { out.unshift(cur); if (cur === ROOT || cur === '/') break; cur = parent(cur); }
  return out;
}
let loadToken = 0;
async function openFolder(p, { push = true } = {}) {
  p = normalize(p);
  if (push && state.view === 'folder' && state.path && state.path !== p) state.hist.push(state.path);
  Object.assign(state, { view: 'folder', path: p, pathFilter: null, loading: true, fsearch: '' });
  state.fileSel.clear();
  document.body.classList.remove('side-open');
  renderAll();
  const tok = ++loadToken;
  for (const a of ancestors(p)) { if (a !== ROOT) tree.open.add(a); await loadKids(a); }
  const [dirs, all] = await Promise.all([listDir(p, 'dirs'), listDir(p, 'all')]);
  if (tok !== loadToken) return;
  state.loading = false;
  state.missing = dirs === null;
  const dn = (dirs || []).map(base).filter((n) => visibleName(n, p));
  tree.kids.set(p, dn);
  const dset = new Set(dirs || []);
  state.dirs = kidsOf(p);
  state.files = (all || []).filter((x) => !dset.has(x)).map(base).filter((n) => !/^[.@]/.test(n)).sort(coll.compare);
  renderAll();
}
function showTorrents(filter, pathFilter = null) {
  Object.assign(state, { view: 'torrents', filter: filter || state.filter, pathFilter });
  store.set('filter', state.filter);
  document.body.classList.remove('side-open');
  renderAll();
}

// Pour les sites qui proposent un flux RSS de leurs recherches via page=rss, l'adresse de la page de résultats est convertie
function toFeedUrl(s) {

function dialog({ title, body, ok = 'OK', okClass = 'primary', onOk = () => {}, onOpen, forced = false, wide = false, cancel = true }) {
  const bd = document.createElement('div');
  bd.className = 'backdrop';
  bd.innerHTML = `<div class="dlg${wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2>
    <div class="body">${body}<p class="err" data-err></p></div>
    <div class="foot">${forced || !cancel ? '' : '<button class="btn" data-x>Annuler</button>'}<button class="btn ${okClass}" data-ok>${esc(ok)}</button></div></div>`;
  document.body.appendChild(bd);
  const close = () => { bd.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape' && !forced) close(); };
  document.addEventListener('keydown', onKey);
  bd.addEventListener('mousedown', (e) => { if (e.target === bd && !forced) close(); });
  if (!forced && cancel) bd.querySelector('[data-x]').onclick = close;
  const okBtn = bd.querySelector('[data-ok]');
  const err = (m) => (bd.querySelector('[data-err]').textContent = m || '');
  okBtn.onclick = async () => {
    okBtn.disabled = true; err('');

    catch (e) { if (e.message !== 'session') err('Erreur : le NAS n\'a pas répondu.'); }
    okBtn.disabled = false;
  };
  bd.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') okBtn.click(); });
  if (onOpen) onOpen(bd);

  });
  // Affiche l'onglet contenant un champ en erreur
  function show(bd, key) {
    const sec = bd.querySelector(`[data-k="${key}"]`).closest('[data-spane]');
    bd.querySelector(`[data-stab="${sec.dataset.spane}"]`).click();
    bd.querySelector(`[data-k="${key}"]`).focus();
  }
}

/* ---------- Espace disque ---------- */
async function freeSpace(path) {
  try {
    const r = await api('app/getFreeSpaceAtPath?path=' + encodeURIComponent(path));
    if (!r.ok) return null;
    const n = Number((await r.text()).trim());
    return Number.isFinite(n) && n >= 0 ? n : null;
  } catch (_) { return null; }
}
// Taille totale d'un fichier .torrent (lecture minimale du format bencode)
async function torrentSize(file) {
  try {
    const b = new Uint8Array(await file.arrayBuffer()), td = new TextDecoder();
    let i = 0;
    const num = (end) => { const j = i; while (b[i] !== end) i++; const n = Number(td.decode(b.subarray(j, i))); i++; return n; };
    const dec = () => {
      const c = b[i];
      if (c === 0x69) { i++; return num(0x65); }                                       // i…e
      if (c === 0x6c) { i++; const a = []; while (b[i] !== 0x65) a.push(dec()); i++; return a; }
      if (c === 0x64) { i++; const o = {}; while (b[i] !== 0x65) { const k = td.decode(dec()); o[k] = dec(); } i++; return o; }
      const len = num(0x3a); const v = b.subarray(i, i + len); i += len; return v;        // longueur:octets
    };
    const info = dec().info || {};
    if (typeof info.length === 'number') return info.length;
    return (info.files || []).reduce((a, f) => a + (f.length || 0), 0);
  } catch (_) { return 0; }
}
function freeHTML() {
  if (state.free == null) return '';
  const cls = state.free < 5 * 2 ** 30 ? 'err' : state.free < 20 * 2 ** 30 ? 'wait' : 'done';
  return `<span class="st ${cls}" title="Espace libre dans le dossier de téléchargement par défaut">Espace libre : ${fmtSize(state.free)}</span>`;
}

function openAddDialog({ files = [], nas = [], magnet = false }) {
  const dest = state.view === 'folder' && state.path ? state.path : state.defaultPath;
  const items = [
    ...files.map((f) => `<li>${I.torrent(18)}<span>${esc(f.name)}</span><small>depuis le PC</small></li>`),
    ...nas.map((p) => `<li>${I.torrent(18)}<span>${esc(base(p))}</span><small>sur le NAS</small></li>`),
  ].join('');
  const count = files.length + nas.length;
  dialog({
    title: magnet ? 'Ajouter des liens magnet' : `Ajouter ${count} torrent${count > 1 ? 's' : ''}`,
    ok: 'Ajouter',
    body: `${magnet ? `<label>Liens magnet ou adresses de fichiers .torrent (un par ligne)<textarea id="mg" rows="5" placeholder="magnet:?xt=urn:btih:…"></textarea></label>` : `<ul class="addlist">${items}</ul>`}
      <div class="dest">${I.folder(28, isVirtual(dest))}<div style="flex:1;min-width:0;display:grid;gap:4px"><small>Enregistrer dans</small>
        <input class="field" id="destp" value="${esc(dest)}" spellcheck="false">
        ${normalize(state.defaultPath) !== dest ? `<small><a href="#" id="usedef" style="color:var(--blue)">Utiliser le dossier par défaut (${esc(relPath(state.defaultPath))})</a></small>` : ''}
        <small id="space" aria-live="polite"></small></div></div>
      <label class="chk"><input type="checkbox" id="startnow" ${store.get('startNow', true) ? 'checked' : ''}> Démarrer le téléchargement immédiatement</label>`,
    onOpen: (bd) => {
      const d = bd.querySelector('#usedef'), destIn = bd.querySelector('#destp');
      if (d) d.onclick = (e) => { e.preventDefault(); destIn.value = state.defaultPath; checkSpace(); };
      // Espace libre à destination, comparé à la taille des .torrent venant du PC
      const need = Promise.all(files.map(torrentSize)).then((l) => l.reduce((a, b) => a + b, 0));
      let tm;
      const checkSpace = async () => {
        const free = await freeSpace(destIn.value.trim() || state.defaultPath), total = await need;
        const el = bd.querySelector('#space'), ok = bd.querySelector('[data-ok]');
        if (free === null) { el.textContent = ''; return; }
        const short = total > 0 && total > free, low = free < 5 * 2 ** 30;
        el.innerHTML = `Espace libre : <b>${fmtSize(free)}</b>${total ? ` · taille des torrents : <b>${fmtSize(total)}</b>` : ''}`
          + (short ? ' — <b style="color:var(--red)">pas assez d\'espace libre</b>' : low ? ' — <b style="color:var(--orange)">espace presque plein</b>' : '');
        ok.textContent = short ? 'Ajouter quand même' : 'Ajouter';
      };
      destIn.addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(checkSpace, 400); });
      checkSpace();
    },
    onOk: async (bd, err) => {
      const dest = bd.querySelector('#destp').value.trim().replace(/\/+$/, '');
      if (!dest.startsWith('/')) { err('Le dossier de destination doit être un chemin complet (ex. /share/Download).'); return false; }
      const startNow = bd.querySelector('#startnow').checked;
      store.set('startNow', startNow);
      const fd = new FormData();
      let urls = [...nas];
      if (magnet) {
        const lines = bd.querySelector('#mg').value.split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
        const bad = lines.filter((l) => !/^(magnet:\?|https?:\/\/|bc:\/\/bt\/)/i.test(l) && !/^[0-9a-f]{40}$/i.test(l));
        if (!lines.length) { err('Collez au moins un lien.'); return false; }
        if (bad.length) { err(`Lien non reconnu : ${bad[0].slice(0, 60)}`); return false; }
        urls = lines;
      }
      for (const f of files) fd.append('torrents', f, f.name);
      if (urls.length) fd.append('urls', urls.join('\n'));
      fd.append('savepath', dest);
      fd.append('autoTMM', 'false');
      fd.append('stopped', String(!startNow));
      fd.append('paused', String(!startNow));
      const r = await post('torrents/add', fd);
      const txt = await r.text();
      let res = null; try { res = JSON.parse(txt); } catch (_) {}
      if (!r.ok || txt.trim() === 'Fails.' || (res && res.failure_count && !res.success_count && !res.pending_count)) {
        err('qBittorrent a refusé l\'ajout (fichier invalide ou torrent déjà présent).'); return false;
      }
      const n = magnet ? urls.length : count;
      const failed = res && res.failure_count ? ` (${res.failure_count} refusé${res.failure_count > 1 ? 's' : ''}, déjà présent ou invalide)` : '';
      toast(`${n} torrent${n > 1 ? 's' : ''} ajouté${n > 1 ? 's' : ''} dans ${base(dest)}${failed}`, !!failed);
      state.fileSel.clear(); renderToolbar(); if (state.view === 'folder') renderFolderView();
      setTimeout(poll, 600);
    },
  });
}

function newFolderDialog() {
  dialog({
    title: 'Nouveau dossier', ok: 'Créer',
    body: `<label>Nom du dossier<input class="field" id="dn" maxlength="200" autocomplete="off"></label>
      <span class="muted" style="font-size:12.5px">Le dossier sera créé sur le NAS au premier torrent que vous y ajouterez.</span>`,
    onOk: async (bd, err) => {
      const n = bd.querySelector('#dn').value.trim();
      if (!n || n === '.' || n === '..' || /[\/\\:*?"<>|]/.test(n)) { err('Nom invalide (caractères interdits : / \\ : * ? " < > |).'); return false; }
      if (state.dirs.some((d) => d.toLowerCase() === n.toLowerCase())) { err('Un dossier porte déjà ce nom.'); return false; }
      if (!virtualDirs.has(state.path)) virtualDirs.set(state.path, new Set());
      virtualDirs.get(state.path).add(n);
      tree.open.add(state.path);
      openFolder(join(state.path, n));
    },
  });
}

function deleteDialog() {
  const hs = [...state.sel], n = hs.length;
  const names = state.torrents.filter((t) => state.sel.has(t.hash)).slice(0, 6).map((t) => `<li>${I.torrent(16)}<span>${esc(t.name)}</span></li>`).join('');
  dialog({
    title: `Supprimer ${n} torrent${n > 1 ? 's' : ''}`, ok: 'Supprimer', okClass: 'primary',
    body: `<ul class="addlist">${names}${n > 6 ? `<li class="muted">… et ${n - 6} autre${n - 6 > 1 ? 's' : ''}</li>` : ''}</ul>
      <label class="chk"><input type="checkbox" id="delfiles"> Supprimer aussi les fichiers téléchargés du NAS</label>`,
    onOk: async (bd) => {
      const deleteFiles = bd.querySelector('#delfiles').checked;
      await post('torrents/delete', { hashes: hs.join('|'), deleteFiles: String(deleteFiles) });
      state.sel.clear(); toast(`${n} torrent${n > 1 ? 's' : ''} supprimé${n > 1 ? 's' : ''}${deleteFiles ? ' avec leurs fichiers' : ''}`);
      renderToolbar(); setTimeout(poll, 400);
    },
  });
}

/* ---------- Événements ---------- */
document.addEventListener('click', async (e) => {
  const t = e.target;
  // Abonnements RSS
  if (t.closest('[data-view=rss]')) return showRss();
  const re = t.closest('[data-rss-edit]');
  if (re) return subscribeDialog({ name: re.dataset.rssEdit });
  const rd = t.closest('[data-rss-del]');
  if (rd) return deleteRssDialog(rd.dataset.rssDel);
  if (t.matches('[data-rss-toggle]')) {
    const n = t.dataset.rssToggle, r = rss.rules[n];
    const res = await post('rss/setRule', { ruleName: n, ruleDef: JSON.stringify({ ...r, enabled: t.checked }) });
    toast(res.ok ? (t.checked ? `« ${n} » réactivé` : `« ${n} » suspendu : plus de téléchargement automatique`) : 'Modification refusée', !res.ok);
    return loadRss();
  }
  const f = t.closest('[data-filter]');
  if (f) return showTorrents(f.dataset.filter);
  const tn = t.closest('#tree .tn');
  if (tn) { if (t.closest('[data-toggle]')) return toggleNode(tn.dataset.path); return openFolder(tn.dataset.path); }
  const cr = t.closest('[data-crumb]');
  if (cr) return openFolder(cr.dataset.crumb);
  const fl = t.closest('[data-folder]');
  if (fl) return openFolder(fl.dataset.folder);
  if (t.closest('[data-here]')) return showTorrents(state.filter, state.path);
  const md = t.closest('[data-mode]');
  if (md) { state.mode = md.dataset.mode; store.set('mode', state.mode); renderToolbar(); return renderFolderView(); }

  const act = t.closest('[data-act]');
  if (act && !act.disabled) {
    const a = act.dataset.act;
    if (a === 'goadd') { store.set('hintSeen', false); return openFolder(state.defaultPath); }
    if (a === 'pc') return $('#pick').click();
    if (a === 'magnet') return openAddDialog({ magnet: true });
    if (a === 'mkdir') return newFolderDialog();
    if (a === 'subscribe') return subscribeDialog({ dest: state.path });
    if (a === 'rssnew') return subscribeDialog();
    if (a === 'rssrefresh') {
      await Promise.all(rss.feeds.map((x) => post('rss/refreshItem', { itemPath: x.path })));
      toast('Vérification des flux lancée'); setTimeout(loadRss, 3000); return setTimeout(poll, 3500);
    }
    if (a === 'rssenable') { rss.prefs = null; await ensureRssEnabled(); toast('Téléchargement automatique activé'); return loadRss(); }
    if (a === 'addsel') return openAddDialog({ nas: [...state.fileSel] });
    if (a === 'back') { const p = state.hist.pop(); if (p) openFolder(p, { push: false }); return; }
    if (a === 'upd') return openFolder(parent(state.path));
    if (a === 'reload') { await loadKids(state.path, true); return openFolder(state.path, { push: false }); }
    if (a === 'start' || a === 'stop') {
      const ok = await torrentAction(a, [...state.sel]);
      toast(ok ? (a === 'start' ? 'Téléchargement démarré' : 'Téléchargement arrêté') : 'Action refusée', !ok);
      return setTimeout(poll, 300);
    }
    if (a === 'delete') return deleteDialog();
  }

  // Panneau de détails : onglets, fermeture, fichiers à télécharger ou non
  const dt = t.closest('[data-dtab]');
  if (dt) {
    det.tab = dt.dataset.dtab; store.set('dtab', det.tab); det.sel.clear();
    if (det.tab === 'peers') { det.peers = null; loadDetails(); }
    if (det.tab === 'webseeds') { det.webseeds = null; loadDetails(); }
    return renderDetails();
  }
  if (t.closest('[data-act=closedet]')) return closeDetails();
  if (t.matches('[data-fprio]')) return setFilePriority([t.dataset.fprio], t.checked);
  if (t.matches('[data-fprio-all]')) return setFilePriority((det.files || []).map((f, i) => f.index ?? i), t.checked);

  // Liste des torrents : un clic sur la ligne sélectionne ce torrent et affiche
  // ses détails ; la case à cocher permet d'en sélectionner plusieurs.
  const tr = t.closest('tr[data-hash]');
  if (tr && !t.closest('[data-folder]')) {
    const h = tr.dataset.hash;
    if (t.matches('input[type=checkbox]')) state.sel.has(h) ? state.sel.delete(h) : state.sel.add(h);
    else { state.sel = new Set([h]); openDetails(h); }
    renderTorrentRows(); renderToolbar(); return renderStatus();
  }
  if (t.id === 'selall') {
    const list = visibleTorrents();
    if (t.checked) list.forEach((x) => state.sel.add(x.hash)); else list.forEach((x) => state.sel.delete(x.hash));
    renderTorrentRows(); renderToolbar(); return renderStatus();
  }
  // Dossier : ouvrir un sous-dossier ou cocher un .torrent
  const op = t.closest('[data-open]');
  if (op) return openFolder(op.dataset.open);
  const pk = t.closest('[data-pick]');
  if (pk) {
    const p = pk.dataset.pick;
    state.fileSel.has(p) ? state.fileSel.delete(p) : state.fileSel.add(p);
    store.set('hintSeen', true);
    // Mise à jour sur place (sans redessiner la liste, pour que le double-clic reste possible)
    const on = state.fileSel.has(p);
    pk.classList.toggle('sel', on);
    const cb = pk.querySelector('input[type=checkbox]'); if (cb) cb.checked = on;
    const tb = $('#toolbar').querySelector('[data-act=addsel]');
    if (tb) { tb.disabled = !state.fileSel.size; tb.lastChild.textContent = 'Ajouter la sélection' + (state.fileSel.size ? ` (${state.fileSel.size})` : ''); }
    return renderStatus();
  }
});
// Double-clic sur un .torrent du NAS : l'ajouter directement
document.addEventListener('dblclick', (e) => {
  const pk = e.target.closest('[data-pick]');
  if (pk) { state.fileSel.clear(); openAddDialog({ nas: [pk.dataset.pick] }); }
});
document.addEventListener('change', async (e) => {
  if (!e.target.matches('[data-rssint]')) return;
  const m = Number(e.target.value);
  const r = await post('app/setPreferences', { json: JSON.stringify({ rss_refresh_interval: m }) });
  toast(r.ok ? `Les flux seront vérifiés toutes les ${m} minutes` : 'Modification refusée', !r.ok);
  loadRss();
});
document.addEventListener('input', (e) => {
  const k = e.target.dataset && e.target.dataset.search;
  if (!k) return;
  state[k] = e.target.value;
  if (k === 'search') { renderTorrentRows(); renderStatus(); } else renderFolderView();
});
$('#pick').addEventListener('change', (e) => {
  const files = [...e.target.files].filter((f) => isTorrentFile(f.name));
  e.target.value = '';
  if (files.length) openAddDialog({ files });
  else toast('Choisissez des fichiers .torrent', true);
});
// Glisser-déposer depuis le PC
const content = $('#content');
let dragDepth = 0;
content.addEventListener('dragenter', (e) => { if (state.view !== 'folder' || !e.dataTransfer.types.includes('Files')) return; e.preventDefault(); dragDepth++; content.classList.add('drag'); });
content.addEventListener('dragover', (e) => { if (state.view === 'folder' && e.dataTransfer.types.includes('Files')) e.preventDefault(); });
content.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; content.classList.remove('drag'); } });
content.addEventListener('drop', (e) => {
  if (state.view !== 'folder') return;
  e.preventDefault(); dragDepth = 0; content.classList.remove('drag');
  const files = [...e.dataTransfer.files].filter((f) => isTorrentFile(f.name));
  if (files.length) openAddDialog({ files }); else toast('Seuls les fichiers .torrent peuvent être déposés ici', true);
});
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => e.preventDefault());

$('#burger').onclick = () => document.body.classList.toggle('side-open');
$('#logout').onclick = async () => { try { await post('auth/logout', {}); } catch (_) {} location.reload(); };
const passwordDialog = (forced = false) => dialog({
  title: forced ? 'Choisissez votre mot de passe' : 'Changer le mot de passe', ok: 'Enregistrer', forced,
  body: `<span class="muted" style="font-size:12.5px">${forced
    ? 'Vous êtes connecté avec le mot de passe initial (adminadmin), connu de tous. Choisissez le vôtre pour continuer (6 caractères minimum).'
    : 'Choisissez un nouveau mot de passe (6 caractères minimum).'}</span>
    <label>Nom d'utilisateur<input class="field" id="pw-u" autocomplete="username"></label>
    <label>Nouveau mot de passe<input class="field" id="pw-1" type="password" autocomplete="new-password"></label>
    <label>Confirmer le mot de passe<input class="field" id="pw-2" type="password" autocomplete="new-password"></label>`,
  onOpen: async (bd) => {
    try { const p = await (await api('app/preferences')).json(); bd.querySelector('#pw-u').value = p.web_ui_username || 'admin'; } catch (_) {}
    bd.querySelector('#pw-1').focus();
  },
  onOk: async (bd, err) => {
    const u = bd.querySelector('#pw-u').value.trim(), a = bd.querySelector('#pw-1').value, b = bd.querySelector('#pw-2').value;
    if (u.length < 3) { err('Le nom d\'utilisateur doit faire au moins 3 caractères.'); return false; }
    if (a.length < 6) { err('Le mot de passe doit faire au moins 6 caractères.'); return false; }
    if (a !== b) { err('Les deux mots de passe ne correspondent pas.'); return false; }
    if (a === 'adminadmin') { err('Choisissez un mot de passe différent du mot de passe initial.'); return false; }
    const r = await post('app/setPreferences', { json: JSON.stringify({ web_ui_username: u, web_ui_password: a }) });
    if (!r.ok) { err('qBittorrent a refusé le changement.'); return false; }
    store.set('mustChange', false);
    toast('Mot de passe enregistré. Il restera valable après les redémarrages.');
  },
});
// L'interface d'origine de qBittorrent est servie à côté de celle-ci (classic.html),
// avec un bouton « Interface explorateur » pour revenir : rien à changer dans les options.
$('#classic').onclick = () => { location.href = 'classic.html'; };

/* ---------- Rafraîchissement ---------- */
let polling = false;
async function poll() {
  if (polling || document.hidden) return;
  polling = true;
  try {
    const tr = await syncMain();
    $('#spd-dl').textContent = '↓ ' + fmtSpeed(tr.dl_info_speed);
    $('#spd-up').textContent = '↑ ' + fmtSpeed(tr.up_info_speed);
    state.conn = tr;
    updateTitle();
    if (!state.freeAt || Date.now() - state.freeAt > 30000) { state.freeAt = Date.now(); freeSpace(state.defaultPath).then((f) => { state.free = f; }); }
    renderFilters();
    if (state.view === 'torrents') {
      const before = state.sel.size;
      renderTorrentRows();
      if (state.sel.size !== before) renderToolbar(); // un torrent sélectionné a disparu
      if (det.hash) { if (state.torrents.some((x) => x.hash === det.hash)) loadDetails(); else renderDetails(); }
    }
    if (state.view === 'rss' && Date.now() - rss.last > 10000 && !document.querySelector('.backdrop')) loadRss();
    if (state.offline) { state.offline = 0; renderToolbar(); }
    renderStatus();
  } catch (e) {
    // qBittorrent arrêté, NAS injoignable… : signalé dans la barre d'état après deux échecs
    if (e.message !== 'session') { state.offline = (state.offline || 0) + 1; if (state.offline >= 2) renderStatus(); }
  }
  polling = false;
}

(async function init() {
  renderAll();
  renderMenubar();
  if (store.get('mustChange', false)) passwordDialog(true);
  loadRss(); // compteur de la barre latérale
  api('app/preferences').then((r) => r.json()).then((p) => { state.prefs = p; }).catch(() => {});
  try {
    const r = await api('app/defaultSavePath');
    if (r.ok) state.defaultPath = normalize((await r.text()).trim()) || ROOT;
  } catch (_) {}
  try { await loadKids(ROOT); } catch (_) {}
  if (!tree.kids.get(ROOT)?.length) $('#tree').innerHTML = `<div class="tree-msg">Impossible de lire ${esc(ROOT)}.</div>`;
  else renderTree();
  await poll();
  setInterval(poll, 2000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
})();
