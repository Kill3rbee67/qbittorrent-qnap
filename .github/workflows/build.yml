name: Build

# - Chaque push et pull request : construction du paquet (artefact téléchargeable).
# - Push sur main avec une nouvelle valeur de QPKG_VER (src/qpkg.cfg) :
#   création automatique du tag v<version> et de la release avec le .qpkg.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Cache (QDK et binaire qBittorrent)
        uses: actions/cache@v4
        with:
          path: .cache
          key: deps-${{ hashFiles('build.sh') }}

      - name: Version du paquet
        id: v
        run: |
          VERSION=$(sed -n 's/^QPKG_VER="\(.*\)"/\1/p' src/qpkg.cfg)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Le tag $GITHUB_REF_NAME ne correspond pas à QPKG_VER=$VERSION (src/qpkg.cfg)"; exit 1
          fi

      - name: Construire le QPKG
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: qpkg-${{ steps.v.outputs.version }}
          path: build/*

      - name: Publier la release
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.v.outputs.exists == 'false')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: qBittorrent pour QNAP ${{ steps.v.outputs.version }}
          files: build/*
          generate_release_notes: true
          body: |
            ## Installation
            1. Téléchargez `qBittorrent_${{ steps.v.outputs.version }}_x86_64.qpkg` ci-dessous (NAS **x86_64** uniquement).
            2. App Center › Paramètres › Général : cochez « Autoriser l'installation d'applications sans signature numérique valide ».
            3. App Center › **Installation manuelle** › choisissez le fichier.
            4. Ouvrez `http://IP-DU-NAS:8085` et connectez-vous avec **admin / adminadmin**, puis choisissez votre mot de passe.

            Mise à jour : installez par-dessus la version précédente, vos torrents et votre mot de passe sont conservés.
            Détails des changements : [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
