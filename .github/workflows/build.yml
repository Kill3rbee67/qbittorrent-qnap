name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Cache (QDK et binaire qBittorrent)
        uses: actions/cache@v4
        with:
          path: .cache
          key: deps-${{ hashFiles('build.sh') }}

      - name: Vérifier que le tag correspond à la version du paquet
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(sed -n 's/^QPKG_VER="\(.*\)"/\1/p' src/qpkg.cfg)
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Le tag ${GITHUB_REF_NAME} ne correspond pas à QPKG_VER=$VERSION (src/qpkg.cfg)"; exit 1
          fi

      - name: Construire le QPKG
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: qpkg
          path: build/*

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*
          generate_release_notes: true
