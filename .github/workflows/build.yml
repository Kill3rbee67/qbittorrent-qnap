# SPDX-License-Identifier: GPL-2.0-or-later
name: Build

# - Chaque push et pull request : vérification des empreintes des binaires amont,
#   construction des paquets, test de mise à jour depuis la dernière release.
#   Si une étape échoue, rien n'est publié.
# - Push sur main avec une nouvelle valeur de QPKG_VER (src/qpkg.cfg) :
#   création automatique du tag v<version> et de la release avec le .qpkg.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances
        run: sudo apt-get update && sudo apt-get install -y rsync qt6-l10n-tools

      - name: Cache (QDK et binaire qBittorrent)
        uses: actions/cache@v4
        with:
          path: .cache
          key: deps-${{ hashFiles('build.sh') }}

      - name: Version du paquet
        id: v
        run: |
          VERSION=$(sed -n 's/^QPKG_VER="\(.*\)"/\1/p' src/qpkg.cfg)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Le tag $GITHUB_REF_NAME ne correspond pas à QPKG_VER=$VERSION (src/qpkg.cfg)"; exit 1
          fi

      - name: Vérifier les empreintes des binaires amont
        run: ./build.sh --check

      - name: Vérifier l'interface (couleurs en dur, contrastes des thèmes)
        run: python3 tests/interface-check.py

      - name: Construire les paquets
        run: ./build.sh

      - name: Test de mise à jour depuis la dernière release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tests/upgrade-test.sh build/qBittorrent_${{ steps.v.outputs.version }}_x86_64.qpkg

      - uses: actions/upload-artifact@v4
        with:
          name: qpkg-${{ steps.v.outputs.version }}
          path: build/*

      - name: Publier la release
        id: release
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.v.outputs.exists == 'false')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: qBittorrent pour QNAP ${{ steps.v.outputs.version }}
          files: build/*
          generate_release_notes: true
          body: |
            ## Installation
            1. Téléchargez ci-dessous le paquet de votre processeur : `qBittorrent_${{ steps.v.outputs.version }}_x86_64.qpkg` (Intel / AMD) ou `qBittorrent_${{ steps.v.outputs.version }}_arm_64.qpkg` (ARM 64 bits, expérimental).
            2. App Center › Paramètres › Général : cochez « Autoriser l'installation d'applications sans signature numérique valide ».
            3. App Center › **Installation manuelle** › choisissez le fichier.
            4. Ouvrez `http://IP-DU-NAS:8085` et connectez-vous avec **admin / adminadmin** (mot de passe initial public), puis choisissez votre mot de passe. N'exposez pas ce port sur Internet.

            Plus simple : ajoutez la source d'applications `https://raw.githubusercontent.com/${{ github.repository }}/main/repository.xml` dans l'App Center (Paramètres › Source d'applications) pour installer en un clic et recevoir les mises à jour (en test).

            Mise à jour : installez par-dessus la version précédente, vos torrents, abonnements, réglages et votre mot de passe sont conservés (vérifié automatiquement à chaque release).
            Provenance et empreintes de tout ce qui est embarqué : `PROVENANCE.txt` ci-dessous.
            Détails des changements : [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)

      # Source d'applications de l'App Center : pointe vers la release qui vient
      # d'être publiée. Mise à jour seulement après la publication, pour qu'elle
      # ne référence jamais un paquet inexistant.
      - name: Mettre à jour repository.xml
        if: steps.release.outcome == 'success'
        run: |
          git fetch origin main
          git checkout -B main origin/main
          tools/make-repository.sh "$GITHUB_REPOSITORY"
          if git diff --quiet -- repository.xml; then
            echo "repository.xml déjà à jour"; exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "repository.xml : qBittorrent ${{ steps.v.outputs.version }}" -- repository.xml
          git push origin main
